const esc = s => {
  const d = document.createElement("span");
  d.textContent = String(s);
  return d.innerHTML;
};
const fmtDate = d => d.replaceAll("-",".");
const app = document.getElementById("app");
const foot = document.getElementById("colophon");
const params = new URLSearchParams(location.search);
let LANG = params.get("lang") || localStorage.getItem("site-lang") || "en";
if(!["en","zh"].includes(LANG)) LANG = "en";
const T = () => I18N[LANG];

function sechead(no, label){
  return `<div class="sechead"><span>${no}</span><span class="label">${label}</span><span class="line"></span></div>`;
}
function postTitle(p){ return LANG === "en" ? p.title_en : p.title; }
function seriesOf(p){ return LANG === "en" ? p.series_en : p.series; }

function renderChrome(){
  const t = T();
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : "en";
  document.getElementById("mast-sub").textContent = t.mastSub;
  document.getElementById("nav").innerHTML = t.nav.map(([label,href]) =>
    `<a href="${href}"${href.startsWith("http")?' target="_blank" rel="noopener"':''}>${label}</a>`).join("");
  document.getElementById("lang").innerHTML = LANG === "en"
    ? '<b>EN</b><span class="sep">/</span><a data-lang="zh">中文</a>'
    : '<a data-lang="en">EN</a><span class="sep">/</span><b>中文</b>';
  document.querySelectorAll("#lang a[data-lang]").forEach(a => {
    a.addEventListener("click", () => {
      LANG = a.dataset.lang;
      localStorage.setItem("site-lang", LANG);
      const q = new URLSearchParams(location.search);
      q.set("lang", LANG);
      history.replaceState(null, "", "?" + q.toString());
      renderChrome();
      const slug = q.get("post");
      slug ? renderPost(slug) : renderHome();
      renderFoot();
    });
  });
}

function renderFoot(){
  const t = T();
  foot.innerHTML = `<div class="ornament">❦</div>

}

async function renderPost(slug){
  const t = T();
  const idx = POSTS.findIndex(x => x.file === slug);
  const p = POSTS[idx];
  if(!p){ app.innerHTML = `${sechead("00", t.sec[2][0])}<h2 class="sec">${esc(t.notFound)}</h2><a class="back" href="?lang=${LANG}">${esc(t.back)}</a>`; return; }
  const no = String(POSTS.length - idx).padStart(2,"0");
  app.innerHTML = `<p class="loading">${esc(LANG === "en" ? "Loading" : "加载中")}</p>`;
  let meta = {};
  try{
    const y = await (await fetch(`posts/meta/${slug}.yaml`)).text();
    y.split("\n").forEach(l => {
      const m = l.match(/^([A-Za-z_]+):\s*(.*)$/);
      if(m && !l.startsWith(" ") && m[2]) meta[m[1]] = m[2].replace(/^["']|["']$/g,"");
    });
  }catch(e){}
  let md;
  try{ md = await (await fetch(`posts/${slug}.md`)).text(); }
  catch(e){ app.innerHTML = `<h2 class="sec">${esc(postTitle(p))}</h2><p>${esc(t.loadFail)}</p><a class="back" href="?lang=${LANG}">${esc(t.back)}</a>`; return; }
  md = md.replaceAll("../assets/", "assets/");
  const picture = md.match(/<picture>[\s\S]*?<\/picture>/);
  md = md.replace(/<picture>[\s\S]*?<\/picture>\s*/,"");
  const body = marked.parse(md);
  const mins = Math.max(1, Math.round(md.replace(/<[^>]+>/g,"").length/500));
  const older = POSTS[idx+1], newer = POSTS[idx-1];
  const plinks = [];
  if(older) plinks.push(`<a href="?post=${older.file}&lang=${LANG}"><span class="lab">${esc(t.older)}</span><b>${esc(postTitle(older))}</b></a>`);
  if(newer) plinks.push(`<a href="?post=${newer.file}&lang=${LANG}"><span class="lab">${esc(t.newer)}</span><b>${esc(postTitle(newer))}</b></a>`);
  const pager = plinks.length ? `<nav class="pager${plinks.length===1?" one":""}">${plinks.join("")}</nav>` : "";
  app.innerHTML = `
    ${sechead(no, esc(seriesOf(p)))}
    ${t.chineseNotice?`<p class="notice">${esc(t.chineseNotice)}</p>`:""}
    <h2 class="sec" style="font-size:30px;margin-bottom:12px">${esc(meta.title || p.title)}</h2>
    ${meta.subtitle?`<p class="subtitle">${esc(meta.subtitle)}</p>`:""}
    <div class="meta">
      <span>${fmtDate(p.date)}</span><span>·</span><span>${esc(seriesOf(p))}</span><span>·</span>
      <span>${mins} ${esc(t.minRead)}</span><span>·</span><span>${esc(t.chinese)}</span>
      ${p.draft?'<span>·</span><span class="draft">'+esc(t.draft)+'</span>':''}
    </div>
    ${picture?`<div class="hero-img">${picture[0]}</div>`:""}
    <div class="body">${body}</div>
    ${pager}
    <a class="back" href="?lang=${LANG}">${esc(t.back)}</a>`;
  scheduleMotion();
}

/* 动效：光晕跟手、进度线、进入视口一次性淡入 */
let motionObserver = null, motionBound = false;
function bindGlobalMotion(){
  if(motionBound) return;
  motionBound = true;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const bar = document.querySelector(".progress");
  const onScroll = () => {
    const max = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = `scaleX(${max>0 ? Math.min(1, scrollY/max) : 0})`;
  };
  addEventListener("scroll", onScroll, {passive:true});
  addEventListener("resize", onScroll);
  onScroll();

  if(!matchMedia("(pointer: fine)").matches) return;
  const glow = document.querySelector(".bg-glow");
  const mark = document.querySelector(".wordmark .mono-mark");
  const mast = document.querySelector(".masthead");
  let tx=innerWidth/2, ty=innerHeight*.35, cx=tx, cy=ty, raf=0;
  const loop = () => {
    cx += (tx-cx)*.12; cy += (ty-cy)*.12;
    glow.style.transform = `translate3d(${cx}px,${cy}px,0)`;
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
  addEventListener("pointermove", e => {
    tx=e.clientX; ty=e.clientY;
    glow.classList.add("body-ready");
  },{passive:true});
  document.addEventListener("visibilitychange", () => {
    cancelAnimationFrame(raf);
    if(!document.hidden) raf=requestAnimationFrame(loop);
  });
  if(mast && mark){
    mast.addEventListener("pointermove", e => {
      const r=mast.getBoundingClientRect();
      const dx=(e.clientX-(r.left+r.width/2))/r.width*6;
      const dy=(e.clientY-(r.top+r.height/2))/r.height*4;
      mark.style.transform=`translate3d(${dx}px,${dy}px,0)`;
    });
    mast.addEventListener("pointerleave", () => { mark.style.transform=""; });
  }
}
function scheduleMotion(){ requestAnimationFrame(() => {
  bindGlobalMotion();
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(motionObserver) motionObserver.disconnect();
  motionObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting){
        e.target.classList.add("in");
        motionObserver.unobserve(e.target);
      }
    });
  },{rootMargin:"0px 0px -6% 0px", threshold:.06});
  document.querySelectorAll(".reveal:not(.in)").forEach(el => motionObserver.observe(el));
});}

renderChrome();
renderFoot();
const slug = params.get("post");
slug ? renderPost(slug) : renderHome();
