<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eastr5 · Blog</title>
<script src="assets/js/marked.min.js"></script>
<style>
:root{
  --bg:#F7F6F3; --panel:#FFFFFF; --border:#E2E0DA; --text:#24292F;
  --muted:#8A8578; --acc:#1F7A52; --acc-soft:#E8F0EB;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1C1C1A; --panel:#232320; --border:#33322E; --text:#E8E6E1;
    --muted:#96917F; --acc:#4CAF82; --acc-soft:#1B2721;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.85 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px; margin:0 auto; padding:56px 20px 80px}
a{color:var(--acc); text-decoration:none}
a:hover{text-decoration:underline}
.brand{
  font-family:Georgia,"Noto Serif SC","Source Han Serif SC",serif;
  font-size:34px; font-weight:700; letter-spacing:.5px; margin:0;
}
.brand .dot{color:var(--acc)}
.tagline{color:var(--muted); margin:10px 0 0; font-size:15px}
.rule{height:3px; width:56px; background:var(--acc); border:0; margin:26px 0 34px}
/* 文章列表 */
.post{
  display:block; padding:22px 0; border-bottom:1px solid var(--border);
}
.post .date{font-size:13px; color:var(--muted); letter-spacing:1px}
.post .title{
  font-family:Georgia,"Noto Serif SC","Source Han Serif SC",serif;
  font-size:21px; font-weight:700; line-height:1.5; margin:6px 0 8px;
  color:var(--text);
}
a.plink:hover .title{color:var(--acc); text-decoration:none}
.badges{font-size:12.5px; color:var(--muted)}
.badges .series{color:var(--acc)}
.badges .draft{
  border:1px solid var(--acc); color:var(--acc); border-radius:3px;
  padding:1px 7px; margin-left:8px; font-size:11.5px;
}
/* 文章页 */
.kicker{font-size:13px; letter-spacing:2px; color:var(--acc); font-weight:600}
h1.title{
  font-family:Georgia,"Noto Serif SC","Source Han Serif SC",serif;
  font-size:30px; line-height:1.45; margin:10px 0 6px;
}
.subtitle{color:var(--muted); font-size:15.5px; margin:0 0 6px}
.meta{color:var(--muted); font-size:13px; margin-bottom:30px}
.hero{margin:0 0 34px}
.hero img{width:100%; border:1px solid var(--border); border-radius:8px; display:block}
.body h2{
  font-family:Georgia,"Noto Serif SC","Source Han Serif SC",serif;
  font-size:21px; margin:38px 0 14px; padding-left:12px;
  border-left:4px solid var(--acc); line-height:1.4;
}
.body h3{font-size:17.5px; margin:26px 0 10px}
.body p{margin:14px 0}
.body ul,.body ol{padding-left:24px}
.body li{margin:8px 0}
.body strong{color:var(--text)}
.body blockquote{
  margin:18px 0; padding:2px 18px; color:var(--muted);
  border-left:3px solid var(--border);
}
.body code{background:var(--acc-soft); padding:2px 6px; border-radius:4px; font-size:.9em}
.back{display:inline-block; margin-top:48px; font-size:14px}
.loading{color:var(--muted); padding:60px 0; text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="loading">加载中…</p></div>
<script>
const POSTS = [
  {file:"2026-11-09-academic-tikz-merge", title:"Skills 花样众多，损耗的是注意力，边际效益会下降", date:"2026-11-09", series:"AI 产品", draft:true},
  {file:"2026-11-10-context-budget", title:"溢出的上下文，会损坏模型的智力吗", date:"2026-11-10", series:"AI 产品", draft:true},
  {file:"2026-11-12-ai-security", title:"AI 把攻防的时间差压到了小时级", date:"2026-11-12", series:"AI 产品", draft:true},
  {file:"2026-11-14-ai-sentinel", title:"AI 哨兵该站在哪：安全正在从一次付费变成按次付费", date:"2026-11-14", series:"AI 产品", draft:true},
];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const app = document.getElementById("app");

function header(){
  return `<h1 class="brand">Eastr5<span class="dot"> · </span>Blog</h1>
    <p class="tagline">把和 AI 的讨论，整理成可回看的想法笔记。一篇只讲一个想法；重点不是 AI 说了什么，而是我采纳了什么、没采纳什么、为什么。</p>
    <hr class="rule">`;
}

function renderList(){
  app.innerHTML = header() + POSTS.map(p => `
    <a class="post plink" href="?post=${p.file}">
      <div class="date">${p.date}</div>
      <div class="title">${esc(p.title)}</div>
      <div class="badges"><span class="series">${p.series}</span>${p.draft?'<span class="draft">草稿</span>':''}</div>
    </a>`).join("");
}

async function renderPost(slug){
  const p = POSTS.find(x => x.file === slug);
  if(!p){ app.innerHTML = header() + "<p>文章不存在。</p><a class='back' href='./'>← 返回列表</a>"; return; }
  app.innerHTML = header() + '<p class="loading">正在加载正文…</p>';
  let meta = {};
  try{
    const y = await (await fetch(`posts/meta/${slug}.yaml`)).text();
    y.split("\n").forEach(l => {
      const m = l.match(/^([A-Za-z_]+):\s*(.*)$/);
      if(m && !l.startsWith(" ") && m[2]) meta[m[1]] = m[2].replace(/^["']|["']$/g,"");
    });
  }catch(e){/* 元数据缺失时静默降级 */}
  let md;
  try{ md = await (await fetch(`posts/${slug}.md`)).text(); }
  catch(e){ app.innerHTML = header() + "<p>正文加载失败。</p><a class='back' href='./'>← 返回列表</a>"; return; }
  md = md.replaceAll("../assets/", "assets/");
  const picture = md.match(/<picture>[\s\S]*?<\/picture>/);
  md = md.replace(/<picture>[\s\S]*?<\/picture>\s*/,"");
  const body = marked.parse(md);
  app.innerHTML = header() + `
    <p class="kicker">${esc(meta.kicker || p.series)}</p>
    <h1 class="title">${esc(meta.title || p.title)}</h1>
    ${meta.subtitle?`<p class="subtitle">${esc(meta.subtitle)}</p>`:""}
    <p class="meta">${p.date} · ${p.series}${p.draft?" · 草稿":""}</p>
    ${picture?`<div class="hero">${picture[0]}</div>`:""}
    <div class="body">${body}</div>
    <a class="back" href="./">← 返回列表</a>`;
}

const slug = new URLSearchParams(location.search).get("post");
slug ? renderPost(slug) : renderList();
</script>
</body>
</html>
