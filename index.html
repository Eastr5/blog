<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>张世昌 Shawn Zhang · AI 产品经理</title>
<meta name="description" content="张世昌（Shawn Zhang），AI 产品经理，关注 AI 与具体场景，尤其是增长和风控。中央财经大学电子商务本科、产业经济学硕士（数字经济方向）。这里是我的个人主页与 AI 笔记簿。">
<script src="assets/js/marked.min.js"></script>
<style>
:root{
  --paper:#F6F5F1; --ink:#1B1A17; --soft:#4A4842; --muted:#8C887D; --line:#DDDBD2;
  --green:#1F7A52; --green-deep:#0F4B32; --green-soft:#E9EFE9;
  --tan:#A8692F; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --serif:Georgia,"Songti SC","Noto Serif SC","Source Han Serif SC",serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#191917; --ink:#E9E6DE; --soft:#C3BFB4; --muted:#8E8A7E; --line:#33312B;
    --green:#5CB98C; --green-deep:#0E2E20; --green-soft:#1C2620;
    --tan:#C98F55;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:16px/1.95 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"palt" 1;
}
a{color:inherit; text-decoration:none; border-bottom:1px solid transparent; transition:border-color .15s,color .15s}
a:hover{color:var(--green); border-bottom-color:var(--green); text-decoration:none}
.wrap{max-width:720px; margin:0 auto; padding:0 24px}

/* 报头：绿——棕双线 */
.topline{height:3px; background:var(--green)}
.topline+.topline{height:2px; background:var(--tan)}

.masthead{padding:34px 0 0; text-align:center}
.wordmark{
  font-family:var(--serif); font-size:16px; letter-spacing:6px; font-weight:700;
  border-bottom:0;
}
.wordmark em{
  display:block; font-style:normal; font-size:10.5px; letter-spacing:5px;
  color:var(--muted); font-weight:400; margin-top:8px;
}
.masthead nav{
  margin:20px 0 0; padding:12px 0; border-top:1px solid var(--line);
  display:flex; justify-content:center; gap:0; font-size:11.5px; letter-spacing:3px;
  color:var(--muted);
}
.masthead nav a{padding:0 16px; color:var(--muted)}
.masthead nav a + a{border-left:1px solid var(--line)}
.masthead nav a:hover{color:var(--green)}

main{padding:58px 0 30px}
/* 章头：编号 + 名称 + 细线 */
.sechead{
  display:flex; align-items:center; gap:12px; margin:0 0 8px;
  font-family:var(--mono); font-size:11px; letter-spacing:2.5px; color:var(--tan);
}
.sechead .label{letter-spacing:4px; color:var(--muted)}
.sechead .line{flex:1; height:1px; background:var(--line)}
h2.sec{
  font-family:var(--serif); font-size:27px; line-height:1.45; font-weight:700;
  margin:0 0 26px; letter-spacing:.5px;
}
section{margin-bottom:66px}

/* Hero */
h1.hero{
  font-family:var(--serif); font-size:50px; line-height:1.25; font-weight:700;
  margin:0 0 4px; letter-spacing:2px;
}
.hero-latin{
  font-family:var(--serif); font-style:italic; font-size:22px; color:var(--muted);
  margin:0 0 26px; letter-spacing:.5px;
}
.statement{
  font-family:var(--serif); font-size:20.5px; line-height:1.95; margin:0 0 24px;
  color:var(--ink); max-width:34em;
}
.statement .hl{color:var(--green)}
.hero-text{font-size:15px; line-height:2; color:var(--soft)}
.hero-text p{margin:0 0 16px}

/* 关注条：细线框住的字排版，不用胶囊 */
.focus{
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  padding:11px 2px; margin:28px 0 26px; display:flex; flex-wrap:wrap;
  align-items:baseline; gap:0 10px;
  font-family:var(--mono); font-size:11.5px; letter-spacing:1.5px; color:var(--soft);
}
.focus .k{color:var(--tan); letter-spacing:3px; margin-right:6px}
.focus .s{color:var(--line)}
.focus span:not(.k):not(.s):hover{color:var(--green)}

.links{font-size:12.5px; letter-spacing:2.5px; color:var(--muted); margin-top:4px}
.links a{border-bottom:1px solid var(--line)}
.links a:hover{border-bottom-color:var(--green)}

/* 索引式条目（项目 / 写作通用） */
.entry{border-top:1px solid var(--line); padding:24px 0 22px}
.entry:last-child{border-bottom:1px solid var(--line)}
.entry .head{display:flex; align-items:baseline; gap:14px}
.entry .no{
  font-family:var(--mono); font-size:11px; color:var(--tan);
  letter-spacing:1px; width:24px; flex:0 0 24px; padding-top:2px;
}
.entry h3{
  font-family:var(--serif); font-size:20px; font-weight:700; line-height:1.5;
  margin:0; flex:1; letter-spacing:.3px;
}
.entry .when{
  font-family:var(--mono); font-size:10.5px; letter-spacing:1.5px; color:var(--muted);
  white-space:nowrap; padding-top:4px;
}
.entry .desc{margin:8px 0 0 38px; font-size:14px; line-height:1.95; color:var(--soft)}
.entry .more{margin:10px 0 0 38px; font-size:12px; letter-spacing:2px; color:var(--muted)}
.entry .more a{border-bottom:1px solid var(--line)}
.entry .more a:hover{border-bottom-color:var(--green)}

/* 写作条目：标题链接覆盖整行 */
a.rowlink{display:block; border-bottom:0}
a.rowlink:hover{border-bottom:0; color:inherit}
a.rowlink:hover h3{color:var(--green)}
.kind{
  font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--muted);
  display:block; margin:8px 0 0 38px;
}
.kind .draft{color:var(--tan)}

/* 经历：定义列表，两栏 */
.cv{border-top:1px solid var(--line)}
.cv-row{
  display:grid; grid-template-columns:158px 1fr; gap:6px 24px;
  padding:18px 0; border-bottom:1px solid var(--line);
}
.cv-row dt{
  font-family:var(--mono); font-size:11px; letter-spacing:1.5px; color:var(--tan);
  padding-top:3px;
}
.cv-row dd{margin:0}
.cv-row dd b{
  font-family:var(--serif); font-size:16.5px; font-weight:700; display:block;
  line-height:1.6;
}
.cv-row dd span{font-size:13.5px; color:var(--muted); line-height:1.9; display:block; margin-top:2px}

/* 联系 */
.closing{text-align:center; padding:6px 0 10px}
.closing p{
  font-family:var(--serif); font-size:18px; line-height:2; margin:0 0 18px; color:var(--ink);
}
.closing .links{letter-spacing:3px}

/* 文章页 */
.subtitle{font-family:var(--serif); font-style:italic; font-size:16.5px; color:var(--muted); margin:0 0 14px}
.meta{
  font-family:var(--mono); font-size:11px; letter-spacing:2px; color:var(--muted);
  margin-bottom:34px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline;
}
.meta .draft{color:var(--tan)}
.hero-img{margin:0 0 40px}
.hero-img img{width:100%; display:block; border:1px solid var(--line)}
.body{font-size:16.5px; line-height:2}
.body h2{
  font-family:var(--serif); font-size:22.5px; line-height:1.5; margin:46px 0 18px;
  padding-top:14px; border-top:1px solid var(--line); letter-spacing:.3px;
}
.body h3{font-size:17px; margin:30px 0 12px}
.body p{margin:17px 0}
.body ul,.body ol{padding-left:24px; margin:17px 0}
.body li{margin:10px 0}
.body blockquote{
  margin:22px 0; padding:0 0 0 20px; border-left:2px solid var(--tan);
  color:var(--soft); font-family:var(--serif); font-size:16.5px;
}
.body blockquote p{margin:10px 0}
.body code{
  background:var(--green-soft); padding:1px 6px; font-size:.86em; font-family:var(--mono);
}
.body pre{background:#141414; color:#DDE6DF; padding:16px 18px; overflow:auto; font-size:13.5px}
.body pre code{background:none; padding:0}
.body img{max-width:100%}
.back{
  display:block; text-align:center; margin-top:56px; padding-top:22px;
  border-top:1px solid var(--line); font-family:var(--mono); font-size:11px;
  letter-spacing:3px; color:var(--muted);
}
.loading{color:var(--muted); padding:60px 0; text-align:center; letter-spacing:2px; font-size:12px}

/* 版权页式页脚 */
.foot{padding:10px 0 54px; text-align:center}
.foot .ornament{
  color:var(--tan); font-size:13px; letter-spacing:8px; margin-bottom:16px;
}
.foot .fm{
  font-family:var(--serif); font-size:14px; letter-spacing:2px; margin:0 0 6px;
}
.foot .fs{
  font-family:var(--mono); font-size:10.5px; letter-spacing:2px; color:var(--muted);
  line-height:2.1; margin:0;
}
.foot a{border-bottom:1px solid var(--line)}
@media (max-width:640px){
  .masthead nav{flex-wrap:wrap; gap:0}
  .masthead nav a{padding:2px 12px; font-size:10.5px}
  h1.hero{font-size:38px}
  .statement{font-size:18px}
  h2.sec{font-size:23px}
  .entry .when{display:none}
  .cv-row{grid-template-columns:1fr; gap:2px}
  .cv-row dt{padding-top:0}
  .entry .desc,.entry .more,.kind{margin-left:0}
}
</style>
</head>
<body>
<div class="topline"></div><div class="topline"></div>
<header class="masthead">
  <div class="wrap">
    <a class="wordmark" href="./">张世昌<em>SHAWN ZHANG · 个人主页</em></a>
    <nav>
      <a href="#about">关于</a><a href="#work">项目</a><a href="#writing">写作</a><a href="#experience">经历</a>
      <a href="https://github.com/Eastr5" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app"><p class="loading">加载中</p></main>

<footer class="foot" id="colophon"></footer>

<script>
const POSTS = [
  {file:"2026-11-09-academic-tikz-merge", title:"Skills 花样众多，损耗的是注意力，边际效益会下降", date:"2026-11-09", series:"AI 产品", draft:true},
  {file:"2026-11-10-context-budget", title:"溢出的上下文，会损坏模型的智力吗", date:"2026-11-10", series:"AI 产品", draft:true},
  {file:"2026-11-12-ai-security", title:"AI 把攻防的时间差压到了小时级", date:"2026-11-12", series:"AI 产品", draft:true},
  {file:"2026-11-14-ai-sentinel", title:"AI 哨兵该站在哪：安全正在从一次付费变成按次付费", date:"2026-11-14", series:"AI 产品", draft:true},
];
const PROJECTS = [
  {name:"skill-router-v3", year:"2026 · 进行中",
   desc:"零安装的 MCP-Skill-Tool 路由器。一个纯 Markdown 的 SKILL.md，让 AI 在自己的技能、MCP 和工具里选路。自建 38 条评测集，Top-1 86.7%，口径与波动都写在 README 里。",
   link:"https://github.com/Eastr5/skill-router-v3", more:"GitHub"},
  {name:"academic-tikz", year:"2025 · 维护",
   desc:"把三个互相抢触发的 TikZ 绘图技能合并成一个入口，模板、脚本与 recipes 全部保留，重新设计的是路由。",
   link:"https://github.com/Eastr5/academic-tikz", more:"GitHub"},
  {name:"AI 笔记簿", year:"2026 · 本页",
   desc:"把和 AI 的讨论整理成可回看的想法笔记。一篇只讲一个想法，重点不是 AI 说了什么，而是我采纳了什么、没采纳什么、为什么。",
   link:"#writing", more:"阅读"},
];
const CV = [
  {when:"2026.04 — 2026.07", what:"外资游戏公司 · AI 部门", desc:"AI 产品经理，负责海外投放方向"},
  {when:"2028 届 · 推免", what:"中央财经大学 · 产业经济学硕士", desc:"数字经济方向"},
  {when:"本科", what:"中央财经大学 · 电子商务", desc:"商务智能方向"},
];
const FOCUS = ["Text2SQL","Agent 系统设计","评测 / Evals","SQL · Python · n8n"];
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const fmtDate = d => d.replaceAll("-",".");
const app = document.getElementById("app");
const foot = document.getElementById("colophon");

function sechead(no, label){
  return `<div class="sechead"><span>${no}</span><span class="label">${label}</span><span class="line"></span></div>`;
}

function renderHome(){
  const projs = PROJECTS.map((p,i) => `
    <article class="entry">
      <div class="head">
        <span class="no">${String(i+1).padStart(2,"0")}</span>
        <h3>${esc(p.name)}</h3>
        <span class="when">${p.year}</span>
      </div>
      <p class="desc">${esc(p.desc)}</p>
      <div class="more"><a href="${p.link}">${p.more} ↗</a></div>
    </article>`).join("");

  const posts = POSTS.map((p,i) => {
    const no = String(POSTS.length - i).padStart(2,"0");
    return `<article class="entry">
      <a class="rowlink" href="?post=${p.file}">
        <div class="head">
          <span class="no">${no}</span>
          <h3>${esc(p.title)}</h3>
          <span class="when">${fmtDate(p.date)}</span>
        </div>
        <span class="kind">${p.series}${p.draft?' · <span class="draft">草稿</span>':''}</span>
      </a>
    </article>`;
  }).join("");

  const cvs = CV.map(c => `
    <div class="cv-row"><dt>${esc(c.when)}</dt><dd><b>${esc(c.what)}</b><span>${esc(c.desc)}</span></dd></div>`).join("");

  app.innerHTML = `
  <section id="about">
    ${sechead("01","关于")}
    <h1 class="hero">张世昌</h1>
    <p class="hero-latin">Shawn Zhang</p>
    <p class="statement">AI 产品经理，关注<span class="hl"> AI 与具体场景</span>，尤其是增长和风控。</p>
    <div class="hero-text">
      <p>中央财经大学电子商务本科（商务智能方向），校内推免至产业经济学硕士（数字经济方向）。2026 年 4 月到 7 月，在一家外资游戏公司新建的 AI 部门做 AI 产品经理，负责海外投放方向。</p>
      <p>做产品时我更在意两件事：把表面需求剥成真实需求，判断哪些交给模型、哪些不交；以及一个功能该不该做，上线后用什么判断它有效。业余时间把和 AI 的讨论整理成笔记，顺手做几个零安装的小工具。</p>
    </div>
    <div class="focus">
      <span class="k">关注</span>
      ${FOCUS.map((f,i) => (i?'<span class="s">/</span>':'') + `<span>${esc(f)}</span>`).join("")}
    </div>
    <div class="links"><a href="https://github.com/Eastr5">GitHub</a> &nbsp;·&nbsp; <a href="#writing">写作</a></div>
  </section>

  <section id="work">
    ${sechead("02","项目")}
    <h2 class="sec">做过的东西</h2>
    ${projs}
  </section>

  <section id="writing">
    ${sechead("03","写作")}
    <h2 class="sec">AI 笔记簿</h2>
    ${posts}
  </section>

  <section id="experience">
    ${sechead("04","经历")}
    <h2 class="sec">简短版本</h2>
    <dl class="cv">${cvs}</dl>
  </section>

  <section id="contact">
    ${sechead("05","联系")}
    <div class="closing">
      <p>想聊 AI 产品、数据与风控，<br>或者 skills 治理，欢迎来信。</p>
      <div class="links"><a href="https://github.com/Eastr5">GitHub</a> &nbsp;·&nbsp; <a href="https://github.com/Eastr5/blog">博客源仓库</a></div>
    </div>
  </section>`;
}

async function renderPost(slug){
  const idx = POSTS.findIndex(x => x.file === slug);
  const p = POSTS[idx];
  if(!p){ app.innerHTML = `${sechead("00","文章")}<h2 class="sec">文章不存在</h2><a class="back" href="./">返回主页</a>`; return; }
  const no = String(POSTS.length - idx).padStart(2,"0");
  app.innerHTML = '<p class="loading">正在加载正文</p>';
  let meta = {};
  try{
    const y = await (await fetch(`posts/meta/${slug}.yaml`)).text();
    y.split("\n").forEach(l => {
      const m = l.match(/^([A-Za-z_]+):\s*(.*)$/);
      if(m && !l.startsWith(" ") && m[2]) meta[m[1]] = m[2].replace(/^["']|["']$/g,"");
    });
  }catch(e){}
  let md;
  try{ md = await (await fetch(`posts/${slug}.md`)).text(); }
  catch(e){ app.innerHTML = `<h2 class="sec">${esc(p.title)}</h2><p>正文加载失败。</p><a class="back" href="./">返回主页</a>`; return; }
  md = md.replaceAll("../assets/", "assets/");
  const picture = md.match(/<picture>[\s\S]*?<\/picture>/);
  md = md.replace(/<picture>[\s\S]*?<\/picture>\s*/,"");
  const body = marked.parse(md);
  const mins = Math.max(1, Math.round(md.replace(/<[^>]+>/g,"").length/500));
  app.innerHTML = `
    ${sechead(no, esc(meta.kicker || p.series))}
    <h2 class="sec" style="font-size:31px;margin-bottom:12px">${esc(meta.title || p.title)}</h2>
    ${meta.subtitle?`<p class="subtitle">${esc(meta.subtitle)}</p>`:""}
    <div class="meta">
      <span>${fmtDate(p.date)}</span><span>·</span>
      <span>${p.series}</span><span>·</span>
      <span>约 ${mins} 分钟</span>
      ${p.draft?'<span>·</span><span class="draft">草稿</span>':''}
    </div>
    ${picture?`<div class="hero-img">${picture[0]}</div>`:""}
    <div class="body">${body}</div>
    <a class="back" href="./">← 返回主页</a>`;

  foot.innerHTML = `
    <div class="ornament">❦</div>
    <p class="fm">张世昌 · Shawn Zhang</p>
    <p class="fs">用 Markdown 写作 · 由 GitHub Pages 托管</p>`;
}

function renderFootHome(){
  foot.innerHTML = `
    <div class="ornament">❦</div>
    <p class="fm">张世昌 · Shawn Zhang</p>
    <p class="fs">用 Markdown 写作 · 由 GitHub Pages 托管<br>二〇二六年</p>`;
}

const slug = new URLSearchParams(location.search).get("post");
if(slug){ renderPost(slug); } else { renderHome(); renderFootHome(); }
</script>
</body>
</html>
